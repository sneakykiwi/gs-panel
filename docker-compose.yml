version: '3.8'

services:
  gs-panel:
    image: ghcr.io/sneakykiwi/gs-panel:master
    container_name: gs-panel
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - gs-panel-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./templates:/data/user-templates:ro
    environment:
      - GS_PANEL_DATA_DIR=/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  gs-panel-data:
    driver: local
