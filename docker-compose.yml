version: '3.8'

services:
  gs-panel:
    image: ghcr.io/sneakykiwi/gs-panel:master
    container_name: gs-panel
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - gs-panel-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./templates:/data/user-templates:ro
    environment:
      - GS_PANEL_DATA_DIR=/data
    group_add:
    # Add this to grant the container user access to /var/run/docker.sock by matching the host's Docker GID
    # Uncomment and set to your actual DOCKER_GID value (defaults to 999 if ${DOCKER_GID} is not set)
    # - "${DOCKER_GID:-999}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  gs-panel-data:
    driver: local
