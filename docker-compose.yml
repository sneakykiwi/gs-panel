version: '3.8'

services:
  gs-panel:
    image: ghcr.io/sneakykiwi/gs-panel:master
    container_name: gs-panel
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./gs-panel/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - GS_PANEL_DATA_DIR=/data
      - GS_PANEL_HOST_DATA_PATH=./gs-panel/data
    user: "0:0"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
