<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - GS Panel</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div id="error-toast" class="fixed top-4 right-4 z-50 max-w-md"></div>
    {{embed}}
    <script>
        document.body.addEventListener('htmx:responseError', function(evt) {
            const toast = document.getElementById('error-toast');
            toast.innerHTML = '<div class="bg-red-500/20 border border-red-500 text-red-300 px-4 py-3 rounded" role="alert">' +
                (evt.detail.xhr.responseText || 'An error occurred') + '</div>';
            setTimeout(() => { toast.innerHTML = ''; }, 5000);
        });

    </script>
</body>
</html>
