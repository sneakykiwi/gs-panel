{{define "partials/backup_item"}}
<div class="flex justify-between items-center p-4 bg-gray-700 rounded mb-2" id="backup-{{.ID}}">
    <div>
        <p class="font-medium">{{.Name}}</p>
        <p class="text-sm text-gray-400">
            {{.CreatedAt.Format "Jan 02, 2006 15:04"}} ·
            {{if gt .SizeBytes 1048576}}
            {{printf "%.1f MB" (divf .SizeBytes 1048576)}}
            {{else}}
            {{printf "%.1f KB" (divf .SizeBytes 1024)}}
            {{end}}
        </p>
    </div>
    <div class="flex gap-2">
        <button hx-post="/backups/{{.ID}}/restore"
                hx-confirm="Restore this backup? Current server files will be overwritten."
                class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded transition">
            Restore
        </button>
        <button hx-delete="/backups/{{.ID}}"
                hx-confirm="Delete this backup?"
                hx-target="#backup-{{.ID}}"
                hx-swap="outerHTML"
                class="px-3 py-1 bg-red-600 hover:bg-red-700 text-white text-sm rounded transition">
            Delete
        </button>
    </div>
</div>
{{end}}
