{{define "partials/server_card"}}
<div class="bg-gray-800 rounded-lg p-6 border border-gray-700"
     id="server-{{.Server.ID}}"
     hx-get="/servers/{{.Server.ID}}/status"
     hx-trigger="every 5s"
     hx-swap="outerHTML">
    <div class="flex justify-between items-start mb-4">
        <div>
            <h3 class="text-xl font-semibold">{{.Server.Name}}</h3>
            <p class="text-gray-400 text-sm">{{.Server.GameType}}</p>
        </div>
        <span class="px-2 py-1 rounded text-xs font-medium
            {{if eq .Server.Status "running"}}bg-green-500/20 text-green-400
            {{else if eq .Server.Status "starting"}}bg-yellow-500/20 text-yellow-400
            {{else}}bg-gray-500/20 text-gray-400{{end}}">
            {{.Server.Status}}
        </span>
    </div>

    <div class="text-sm text-gray-400 mb-4">
        <p>Port: {{.Server.Port}}</p>
        <p>Memory: {{.Server.MemoryLimit}} MB</p>
    </div>

    <div class="flex gap-2">
        {{if eq .Server.Status "running"}}
        <button hx-post="/servers/{{.Server.ID}}/stop" hx-swap="none"
            class="flex-1 bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded text-sm transition">
            Stop
        </button>
        <button hx-post="/servers/{{.Server.ID}}/restart" hx-swap="none"
            class="flex-1 bg-yellow-600 hover:bg-yellow-700 text-white px-3 py-2 rounded text-sm transition">
            Restart
        </button>
        {{else}}
        <button hx-post="/servers/{{.Server.ID}}/start" hx-swap="none"
            class="flex-1 bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded text-sm transition">
            Start
        </button>
        {{end}}
        <a href="/servers/{{.Server.ID}}"
            class="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded text-sm transition text-center">
            Manage
        </a>
    </div>
</div>
{{end}}
