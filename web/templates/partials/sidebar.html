{{define "partials/sidebar"}}
<aside class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col">
    <div class="p-6 border-b border-gray-700">
        <a href="/" class="flex items-center gap-3">
            <svg class="w-8 h-8" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#sidebar-grad)"/>
                <path d="M20 20h8v8h-8zM36 20h8v8h-8zM20 36h8v8h-8zM36 36h8v8h-8z" fill="#fff" opacity="0.9"/>
                <defs>
                    <linearGradient id="sidebar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#3b82f6"/>
                        <stop offset="100%" style="stop-color:#8b5cf6"/>
                    </linearGradient>
                </defs>
            </svg>
            <span class="text-xl font-bold">GS Panel</span>
        </a>
    </div>

    <nav class="flex-1 p-4">
        <a href="/" class="flex items-center px-4 py-2 rounded text-gray-300 hover:bg-gray-700 mb-2">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
            Dashboard
        </a>

        {{if .User.IsAdmin}}
        <a href="/admin/users" class="flex items-center px-4 py-2 rounded text-gray-300 hover:bg-gray-700 mb-2">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"></path>
            </svg>
            Users
        </a>
        {{end}}
    </nav>

    <div class="p-4 border-t border-gray-700">
        <div class="flex items-center justify-between">
            <div class="truncate">
                <p class="text-sm font-medium truncate">{{.User.Email}}</p>
                <p class="text-xs text-gray-400">{{if .User.IsAdmin}}Admin{{else}}User{{end}}</p>
            </div>
            <a href="/logout" class="text-gray-400 hover:text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
            </a>
        </div>
    </div>
</aside>
{{end}}
